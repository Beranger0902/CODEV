spring:
  docker:
    compose:
      # Mettre DOCKER_COMPOSE_ENABLED=false si PostgreSQL est installé localement sans Docker.
      enabled: ${DOCKER_COMPOSE_ENABLED:true}
  # Utilisé uniquement quand Docker Compose est désactivé (sinon Boot se connecte au conteneur).
  datasource:
    # 127.0.0.1 plutôt que localhost : sous WSL2 en réseau « mirrored », localhost
    # se résout d'abord en IPv6 (::1) et ne joint pas le conteneur ; l'IPv4 fonctionne.
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/novacore}
    username: ${DB_USERNAME:novacore}
    password: ${DB_PASSWORD:novacore}
  mail:
    host: 127.0.0.1
    port: 1025

novacore:
  security:
    jwt:
      secret: ${NOVACORE_JWT_SECRET:dev-only-secret-not-for-production-0123456789}

logging:
  level:
    com.novacore: DEBUG
