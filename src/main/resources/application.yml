spring:
  application:
    name: novacore-backend
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # le schéma est géré exclusivement par Flyway
  mvc:
    problemdetails:
      enabled: true
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
      completion-mode: delete

server:
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

novacore:
  frontend-url: ${NOVACORE_FRONTEND_URL:http://localhost:4200}
  security:
    jwt:
      # Obligatoire : au moins 32 caractères. Ne jamais commiter de vraie valeur.
      secret: ${NOVACORE_JWT_SECRET:}
      issuer: novacore
      access-token-ttl: 15m
      refresh-token-ttl: 30d
    cors:
      allowed-origins: ${NOVACORE_CORS_ORIGINS:http://localhost:4200}
  identity:
    terms-version: "2026-10"
    verification-token-ttl: 24h
    password-reset-token-ttl: 30m
    max-failed-logins: 5
    lock-duration: 15m
    resend-cooldown: 2m
  mail:
    from: ${NOVACORE_MAIL_FROM:NovaCore <no-reply@novacore.local>}
